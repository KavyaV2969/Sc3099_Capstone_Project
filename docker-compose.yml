version: '3.8'

services:
  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  postgres:
    image: postgres:15-alpine
    container_name: saiv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saiv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private operator password}
      POSTGRES_DB: ${POSTGRES_DB:-saiv}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  redis:
    image: redis:7-alpine
    container_name: saiv-redis
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  # ==========================================================================
  # Application Services (Students implement these)
  # ==========================================================================

  backend-migrate:
    build:
      context: ./module2-backend
      dockerfile: Dockerfile
    image: saiv-backend:local
    command: ["sh", "-c", "alembic upgrade head && python -m scripts.configure_database_roles"]
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the migration/operator database URL}
      BACKEND_DATABASE_URL: ${BACKEND_DATABASE_URL:?Set a restricted application database URL}
      DASHBOARD_DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
      SECRET_KEY: ${SECRET_KEY:?Set a private JWT secret}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saiv-network

  backend:
    build:
      context: ./module2-backend
      dockerfile: Dockerfile
    container_name: saiv-backend
    image: saiv-backend:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: ${BACKEND_DATABASE_URL:?Set a restricted application database URL}
      REDIS_URL: redis://redis:6379
      SECRET_KEY: ${SECRET_KEY:?Set a private JWT secret}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL:-http://face-recognition:8001}
      PUBLIC_FRONTEND_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8501}
    depends_on:
      backend-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  face-recognition:
    build:
      context: ./module3-face-recognition
      dockerfile: Dockerfile
    container_name: saiv-face-recognition
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - saiv-network

  frontend:
    build:
      context: ./module1-frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000/api/v1}
    container_name: saiv-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_BACKEND_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_FACE_SERVICE_URL: http://localhost:8001
    depends_on:
      - backend
    networks:
      - saiv-network

  dashboard:
    build:
      context: ./module4-observability
      dockerfile: Dockerfile
    container_name: saiv-dashboard
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: ${DASHBOARD_DATABASE_URL:-}
      BACKEND_URL: http://backend:8000
      PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      - backend
      - prometheus
    networks:
      - saiv-network

  # ==========================================================================
  # Observability Services
  # ==========================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: saiv-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./module4-observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - saiv-network

  grafana:
    image: grafana/grafana:latest
    container_name: saiv-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
      - ./module4-observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - saiv-network

  otel-collector:
    image: otel/opentelemetry-collector:latest
    container_name: saiv-otel-collector
    ports:
      - "4317:4317"   # gRPC
      - "4318:4318"   # HTTP
    volumes:
      - ./module4-observability/otel-collector-config.yml:/etc/otel/config.yaml
    command: ["--config=/etc/otel/config.yaml"]
    networks:
      - saiv-network

networks:
  saiv-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
    name: ${REDIS_VOLUME_NAME:-student-starter_redis_data}
  prometheus_data:
  grafana_data:
